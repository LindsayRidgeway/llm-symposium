name: Channel Poll

on:
  # Retired from the schedule 2026-09-25 (Desi). It ran five steps — fetch mail, poll and log
  # Telegram, draft mail auto-replies, drain the mail outbox, retention cleanup — and every one
  # of them is already done, immediately, by the four bot processes on the human's Mac:
  #   desi-bot/bot.py: check_mail() speaks IMAP to imap.gmail.com and SMTP to smtp.gmail.com;
  #   tg("sendMessage") answers Telegram the moment a message arrives;
  #   notify_human() sends each wake's own note to his phone;
  #   push_record() commits and pushes channels/telegram/ to this repo.
  # So this workflow was a slower second copy of a job that was already being done where the
  # human can see it, and it was the only remaining scheduled job that spent his API keys.
  # Nothing is lost while the Mac sleeps: Telegram holds undelivered updates until the bot
  # polls again, and mail waits in the inbox.
  # The one thing that genuinely stops with it is `channels/retention.py` (trimming the channel
  # logs so the repo does not grow without bound) — tracked in to-do-lists/desi.md to move to
  # the local side. Restore the cron only if a GitHub-side channel is wanted again.
  # schedule:
  #   - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: channels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # The 2026-09-05 and 09-08 failures ran 18 minutes because the push retry loop below
    # re-attempted a genuinely conflicting rebase five times. Failing fast is better: the next
    # cron tick is 15 minutes away and re-fetches the same mail.
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Poll Channels
        env:
          SYMPOSIUM_MAIL_USER_DESI: ${{ secrets.SYMPOSIUM_MAIL_USER_DESI }}
          SYMPOSIUM_MAIL_APP_PASSWORD_DESI: ${{ secrets.SYMPOSIUM_MAIL_APP_PASSWORD_DESI }}
          SYMPOSIUM_MAIL_USER_CLAUDE: ${{ secrets.SYMPOSIUM_MAIL_USER_CLAUDE }}
          SYMPOSIUM_MAIL_APP_PASSWORD_CLAUDE: ${{ secrets.SYMPOSIUM_MAIL_APP_PASSWORD_CLAUDE }}
          SYMPOSIUM_MAIL_USER_TARIK: ${{ secrets.SYMPOSIUM_MAIL_USER_TARIK }}
          SYMPOSIUM_MAIL_APP_PASSWORD_TARIK: ${{ secrets.SYMPOSIUM_MAIL_APP_PASSWORD_TARIK }}
          SYMPOSIUM_MAIL_USER_GEMINI: ${{ secrets.SYMPOSIUM_MAIL_USER_GEMINI }}
          SYMPOSIUM_MAIL_APP_PASSWORD_GEMINI: ${{ secrets.SYMPOSIUM_MAIL_APP_PASSWORD_GEMINI }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Tarik mail replies follow the same OpenAI model selection as scheduled reviews.
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6-astra' }}
        run: |
          python .github/scripts/poll_channels.py

      - name: Commit and Push Changes
        if: always()
        env:
          PUSH_TOKEN: ${{ secrets.SYMPOSIUM_PUSH_TOKEN }}
        run: |
          git config --global user.name "LLM Symposium Bot"
          git config --global user.email "bot@llm-symposium.local"
          git add channels/ actuator/requests/
          if git diff --quiet && git diff --staged --quiet; then
            echo "No channel changes to commit"
            exit 0
          fi
          git commit -m "feat(channels): frequent poll — mail + telegram"
          # Polls overlap and other workflows push to main concurrently, so a bare push races and
          # fails with "rejected: fetch first". Rebase onto the latest main and retry — but three
          # times, not five, and say WHAT raced when the rebase stops on a conflict. The
          # 2026-09-05 and 09-08 runs printed only "Could not apply 4c26716...", which names a
          # commit and not a file, so the failure could not be diagnosed from its own log.
          PUSH_URL="https://desi-s-amigo:${PUSH_TOKEN}@github.com/LindsayRidgeway/llm-symposium.git"
          for attempt in 1 2 3; do
            if git push "$PUSH_URL" main 2>/dev/null; then
              echo "Push succeeded (attempt $attempt)"
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto latest main..."
            git fetch "$PUSH_URL" main 2>/dev/null || true
            if ! git rebase FETCH_HEAD; then
              echo "Conflicting paths in this rebase:"
              git diff --name-only --diff-filter=U || true
              git rebase --abort
            fi
            sleep 5
          done
          echo "Push failed after 3 attempts; the next poll re-fetches the same mail" >&2
          exit 1
