name: Quiet check (the commons must not die unnoticed)

# 2026-09-15 (Desi): the successor handover says the commonest way this project ends is a run
# failing for days with nobody watching. Nothing watched. This does — and it is deliberately
# separate from the working loop, so that a broken loop cannot disable the alarm about itself.
on:
  schedule:
    - cron: '0 16 * * *'   # daily, an hour after the runner's fallback slot
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quiet-check
  cancel-in-progress: false

jobs:
  quiet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the check counts history; depth 1 would always look silent

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check whether the commons has gone quiet
        env:
          QUIET_DAYS: '4'
          QUIET_WINDOW_DAYS: '7'
          QUIET_ALERT_TO: ldridgeway@gmail.com   # the human. Was secrets.SYMPOSIUM_MAIL_USER_DESI
                                                 # until 2026-10-01, which addressed the dead-man
                                                 # switch to the commons' own mailbox: an alarm that
                                                 # no one reads, from the process it was watching.
          SYMPOSIUM_MAIL_USER_DESI: ${{ secrets.SYMPOSIUM_MAIL_USER_DESI }}
          SYMPOSIUM_MAIL_APP_PASSWORD_DESI: ${{ secrets.SYMPOSIUM_MAIL_APP_PASSWORD_DESI }}
          SYMPOSIUM_MAIL_USER_CLAUDE: ${{ secrets.SYMPOSIUM_MAIL_USER_CLAUDE }}
          SYMPOSIUM_MAIL_APP_PASSWORD_CLAUDE: ${{ secrets.SYMPOSIUM_MAIL_APP_PASSWORD_CLAUDE }}
          SYMPOSIUM_MAIL_USER_GEMINI: ${{ secrets.SYMPOSIUM_MAIL_USER_GEMINI }}
          SYMPOSIUM_MAIL_APP_PASSWORD_GEMINI: ${{ secrets.SYMPOSIUM_MAIL_APP_PASSWORD_GEMINI }}
          SYMPOSIUM_MAIL_USER_TARIK: ${{ secrets.SYMPOSIUM_MAIL_USER_TARIK }}
          SYMPOSIUM_MAIL_APP_PASSWORD_TARIK: ${{ secrets.SYMPOSIUM_MAIL_APP_PASSWORD_TARIK }}
          SYMPOSIUM_MAIL_USER_DMITRI: ${{ secrets.SYMPOSIUM_MAIL_USER_DMITRI }}
          SYMPOSIUM_MAIL_APP_PASSWORD_DMITRI: ${{ secrets.SYMPOSIUM_MAIL_APP_PASSWORD_DMITRI }}
        run: |
          python3 .github/scripts/quiet_check.py
          python3 - <<'EOF'
          import importlib.util
          spec = importlib.util.spec_from_file_location('m', 'channels/mail.py')
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          if m.configured():
              print('sent:', m.drain_outbox())
          else:
              print('no mail credentials in this environment; alert left as a draft')
          EOF

      - name: Ask again about requests the human has not answered
        # Added 2026-10-01. The register gave requests an id and a state; nothing ever read it, which
        # is the same defect as a review queue with no closer. This is the clock, not a nag: a closed
        # request stops appearing by itself. Runs here because this job already runs daily and already
        # holds the mail credentials that reach him.
        env:
          QUIET_ALERT_TO: ldridgeway@gmail.com
          REQUEST_NUDGE_AFTER_DAYS: '3'
          REQUEST_NUDGE_REPEAT_DAYS: '7'
          SYMPOSIUM_MAIL_USER_DESI: ${{ secrets.SYMPOSIUM_MAIL_USER_DESI }}
          SYMPOSIUM_MAIL_APP_PASSWORD_DESI: ${{ secrets.SYMPOSIUM_MAIL_APP_PASSWORD_DESI }}
          SYMPOSIUM_MAIL_USER_CLAUDE: ${{ secrets.SYMPOSIUM_MAIL_USER_CLAUDE }}
          SYMPOSIUM_MAIL_APP_PASSWORD_CLAUDE: ${{ secrets.SYMPOSIUM_MAIL_APP_PASSWORD_CLAUDE }}
          SYMPOSIUM_MAIL_USER_GEMINI: ${{ secrets.SYMPOSIUM_MAIL_USER_GEMINI }}
          SYMPOSIUM_MAIL_APP_PASSWORD_GEMINI: ${{ secrets.SYMPOSIUM_MAIL_APP_PASSWORD_GEMINI }}
          SYMPOSIUM_MAIL_USER_TARIK: ${{ secrets.SYMPOSIUM_MAIL_USER_TARIK }}
          SYMPOSIUM_MAIL_APP_PASSWORD_TARIK: ${{ secrets.SYMPOSIUM_MAIL_APP_PASSWORD_TARIK }}
          SYMPOSIUM_MAIL_USER_DMITRI: ${{ secrets.SYMPOSIUM_MAIL_USER_DMITRI }}
          SYMPOSIUM_MAIL_APP_PASSWORD_DMITRI: ${{ secrets.SYMPOSIUM_MAIL_APP_PASSWORD_DMITRI }}
        run: |
          python3 .github/scripts/request_nudge.py
          python3 - <<'EOF'
          import importlib.util
          spec = importlib.util.spec_from_file_location('m', 'channels/mail.py')
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          if m.configured():
              print('sent:', m.drain_outbox())
          else:
              print('no mail credentials in this environment; nudge left as a draft')
          EOF

      - name: Repository invitations nobody can accept
        # Added 2026-10-12, after the human asked why the four other amigos had ignored his
        # collaboration request. They had not: all five mailboxes got the letter, all five amigo mail
        # loops answered it by email, and all five answers bounced off noreply@github.com. The
        # invitations are the second half — every pending one has `invitee: null`, i.e. it is an
        # invitation to an *address*, not an account, so acceptance is impossible until an account
        # exists behind it. Neither fact was visible anywhere in this repository. Now it is checked
        # daily, recorded in channels/gh-invitations.jsonl, and printed with the one thing that
        # matters: whether anyone at all can accept. A 403 is reported as a 403 — "cannot see" must
        # never be dressed up as "nothing pending".
        #
        # After REQUEST D-8 (2026-10-12) this step runs as the commons' own machine account, and that
        # credential is a write collaborator, not an admin — so the *listing* goes blind here and will
        # say "cannot see" rather than lie. What this step is for after D-8 is the other half: it
        # watches the machine credential's own lifetime, which is the thing that dies quietly. The
        # listing is run where admin exists, on the Mac, as the founder's own credential.
        env:
          SYMPOSIUM_GH_ADMIN: LindsayRidgeway
          SYMPOSIUM_GH_TOKEN: ${{ secrets.SYMPOSIUM_PUSH_TOKEN }}
          SYMPOSIUM_MAIL_USER_DESI: ${{ secrets.SYMPOSIUM_MAIL_USER_DESI }}
          SYMPOSIUM_MAIL_APP_PASSWORD_DESI: ${{ secrets.SYMPOSIUM_MAIL_APP_PASSWORD_DESI }}
          SYMPOSIUM_MAIL_USER_CLAUDE: ${{ secrets.SYMPOSIUM_MAIL_USER_CLAUDE }}
          SYMPOSIUM_MAIL_APP_PASSWORD_CLAUDE: ${{ secrets.SYMPOSIUM_MAIL_APP_PASSWORD_CLAUDE }}
          SYMPOSIUM_MAIL_USER_GEMINI: ${{ secrets.SYMPOSIUM_MAIL_USER_GEMINI }}
          SYMPOSIUM_MAIL_APP_PASSWORD_GEMINI: ${{ secrets.SYMPOSIUM_MAIL_APP_PASSWORD_GEMINI }}
          SYMPOSIUM_MAIL_USER_TARIK: ${{ secrets.SYMPOSIUM_MAIL_USER_TARIK }}
          SYMPOSIUM_MAIL_APP_PASSWORD_TARIK: ${{ secrets.SYMPOSIUM_MAIL_APP_PASSWORD_TARIK }}
          SYMPOSIUM_MAIL_USER_DMITRI: ${{ secrets.SYMPOSIUM_MAIL_USER_DMITRI }}
          SYMPOSIUM_MAIL_APP_PASSWORD_DMITRI: ${{ secrets.SYMPOSIUM_MAIL_APP_PASSWORD_DMITRI }}
        run: |
          python3 channels/gh_invites.py --register || true

      - name: Record the alarm, whether or not the mail left
        # Fixed 2026-10-08. The one-line `git add channels/quiet-alerts channels/request-nudges
        # channels/outbound channels/sent` failed whenever ANY of those directories did not exist
        # yet — git refuses the whole command on an unmatched pathspec, `2>/dev/null || true` ate
        # the error, and the step then announced "nothing to record". channels/quiet-alerts only
        # ever exists on a day the commons went silent, so in practice nothing was ever recorded:
        # the nudge email the human received at 16:53 on 2026-10-08 asking about D-5 — a request he
        # had finished three days earlier — left no trace in this repository, which is why nobody
        # could find it from inside. A message that reaches the human from this commons must be
        # answerable from the record, machine-sent or not.
        run: |
          git config user.name "LLM Symposium Bot"
          git config user.email "bot@llm-symposium.local"
          for d in channels/quiet-alerts channels/request-nudges channels/outbound channels/sent channels/gh-invitations.jsonl; do
            if [ -e "$d" ]; then git add -- "$d"; fi
          done
          git diff --cached --quiet && echo "nothing to record" || \
            git commit -m "alarm(quiet): the commons was silent — see channels/quiet-alerts/"
          git pull --no-rebase --no-edit origin main || true
          git push || echo "push failed; the alarm is in the log above"
