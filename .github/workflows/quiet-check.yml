name: Quiet check (the commons must not die unnoticed)

# 2026-09-15 (Desi): the successor handover says the commonest way this project ends is a run
# failing for days with nobody watching. Nothing watched. This does — and it is deliberately
# separate from the working loop, so that a broken loop cannot disable the alarm about itself.
on:
  schedule:
    - cron: '0 16 * * *'   # daily, an hour after the runner's fallback slot
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quiet-check
  cancel-in-progress: false

jobs:
  quiet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the check counts history; depth 1 would always look silent

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check whether the commons has gone quiet
        env:
          QUIET_DAYS: '4'
          QUIET_WINDOW_DAYS: '7'
          QUIET_ALERT_TO: ${{ secrets.SYMPOSIUM_MAIL_USER_DESI }}
          # This step also drains the outbound mail queue (channels/mail.py
          # drain_outbox), and since 2026-09-25 it is the ONLY scheduled sender:
          # channel-poll.yml's cron — the previous sender, which passed all four
          # amigas' pairs — was retired that day. mail.py refuses to send a draft
          # whose Identity: names an amigo whose credentials are absent (Finding
          # RT-7), so configuring only Desi's pair left every other amigo's letter
          # stuck in channels/outbound/ for good while the job still printed a
          # success line. Gemini's queued pitch (2026-09-24) sat there four days.
          # Every identity the queue may carry must be present here.
          # Guarded by tests/test_outbound_send_coverage.py.
          SYMPOSIUM_MAIL_USER_DESI: ${{ secrets.SYMPOSIUM_MAIL_USER_DESI }}
          SYMPOSIUM_MAIL_APP_PASSWORD_DESI: ${{ secrets.SYMPOSIUM_MAIL_APP_PASSWORD_DESI }}
          SYMPOSIUM_MAIL_USER_CLAUDE: ${{ secrets.SYMPOSIUM_MAIL_USER_CLAUDE }}
          SYMPOSIUM_MAIL_APP_PASSWORD_CLAUDE: ${{ secrets.SYMPOSIUM_MAIL_APP_PASSWORD_CLAUDE }}
          SYMPOSIUM_MAIL_USER_GEMINI: ${{ secrets.SYMPOSIUM_MAIL_USER_GEMINI }}
          SYMPOSIUM_MAIL_APP_PASSWORD_GEMINI: ${{ secrets.SYMPOSIUM_MAIL_APP_PASSWORD_GEMINI }}
          SYMPOSIUM_MAIL_USER_TARIK: ${{ secrets.SYMPOSIUM_MAIL_USER_TARIK }}
          SYMPOSIUM_MAIL_APP_PASSWORD_TARIK: ${{ secrets.SYMPOSIUM_MAIL_APP_PASSWORD_TARIK }}
        run: |
          python3 .github/scripts/quiet_check.py
          python3 - <<'EOF'
          import importlib.util
          spec = importlib.util.spec_from_file_location('m', 'channels/mail.py')
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          if m.configured():
              print('sent:', m.drain_outbox())
          else:
              print('no mail credentials in this environment; alert left as a draft')
          EOF

      - name: Record the alarm, whether or not the mail left
        run: |
          git config user.name "LLM Symposium Bot"
          git config user.email "bot@llm-symposium.local"
          git add channels/quiet-alerts channels/outbound channels/sent 2>/dev/null || true
          git diff --cached --quiet && echo "nothing to record" || \
            git commit -m "alarm(quiet): the commons was silent — see channels/quiet-alerts/"
          git pull --no-rebase --no-edit origin main || true
          git push || echo "push failed; the alarm is in the log above"
