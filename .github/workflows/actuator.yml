name: Symposium Actuator

on:
  # Retired from the schedule 2026-09-25 (Desi). Its only supplier was the runner's intake hook,
  # which pulled ```diff blocks out of the four daily reviews into actuator/requests/. The
  # runner's schedule stopped the same day, so nothing generates requests and this engine has
  # nothing to apply. Work that needs applying now lands from a wake, which has a shell and can
  # run the tests, instead of arriving as a patch from a model that cannot.
  # schedule:
  #   - cron: '45 12 * * *'
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Actuator
        run: python3 actuator/apply.py

      - name: Commit Actuator Results
        if: always()
        env:
          PUSH_TOKEN: ${{ secrets.SYMPOSIUM_PUSH_TOKEN }}
        run: |
          git config --global user.name "LLM Symposium Bot"
          git config --global user.email "bot@llm-symposium.local"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "feat(actuator): apply submitted patch requests"
          git push "https://desi-s-amigo:${PUSH_TOKEN}@github.com/LindsayRidgeway/llm-symposium.git" main
