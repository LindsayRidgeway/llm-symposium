name: Autonomous Goose — Tarik MVP

on:
  schedule:
    # 15:07 UTC daily. GitHub schedules may be delayed; dispatch tests do not prove cron delivery.
    - cron: '7 15 * * *'
  workflow_dispatch:

concurrency:
  group: autonomous-goose-tarik
  cancel-in-progress: false

jobs:
  autonomous-goose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Pinning makes non-interactive CI installs reproducible.
      # Update deliberately after a successful run, not opportunistically.
      GOOSE_VERSION: "v1.50.0"
      CONFIGURE: "false"
      GOOSE_PROVIDER: "openai"
      # Deliberate hard-task override: keep the bounded autonomous worker on Astra
      # while ordinary Tarik scheduled calls use the cost-conscious Sol default.
      GOOSE_MODEL: ${{ vars.TARIK_AUTONOMOUS_MODEL || vars.OPENAI_MODEL || 'gpt-6-astra' }}
      GOOSE_DISABLE_SESSION_NAMING: "true"
      GOOSE_MAX_TURNS: "40"
      BRANCH_NAME: autonomous/tarik/${{ github.run_id }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Mission Preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/preflight_autonomous_mission.py \
            --mission recipes/autonomous-goose/tarik-mission.md \
            --report "$RUNNER_TEMP/goose-autonomous/preflight.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Install Goose CLI
        if: steps.preflight.outputs.run_worker == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/aaif-goose/goose/releases/download/stable/download_cli.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate Autonomous Recipe
        if: steps.preflight.outputs.run_worker == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Keep the library recipe schema-valid even though the workflow runs
          # from a rendered instruction bundle to avoid YAML-breaking file substitution.
          goose recipe validate recipes/autonomous-goose/tarik.yaml

      - name: Snapshot Trusted Mission Checker
        if: steps.preflight.outputs.run_worker == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/goose-control" "$RUNNER_TEMP/goose-autonomous"
          cp scripts/check_autonomous_mission.py "$RUNNER_TEMP/goose-control/check.py"
          cp scripts/run_autonomous_mission.py "$RUNNER_TEMP/goose-control/run.py"
          cp recipes/autonomous-goose/tarik-mission.md "$RUNNER_TEMP/goose-control/mission.md"
          git rev-parse HEAD > "$RUNNER_TEMP/goose-control/base.txt"
          python3 tests/test_check_autonomous_mission.py
          python3 tests/test_run_autonomous_mission.py

      - name: Build Autonomous Instruction Bundle
        if: steps.preflight.outputs.run_worker == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/goose-autonomous"
          cat > "$RUNNER_TEMP/tarik-instructions.md" <<'EOF'
          You are Tarik S. Commons, the OpenAI/ChatGPT participant in the LLM Symposium.
          You are running as a scheduled, headless Goose session inside a GitHub Actions checkout.

          Boundaries:
          - Work in this repository only. Do not read private local files outside the checkout.
          - Do not print secrets or environment variable values.
          - Dawn/SillyTavern material is out of scope. Do not read it, quote it, summarize it, or reference it.
          - Do not ask Lindsay to choose, approve, or decide. If a step is human-blocked, mark it plainly and move to another agenda item.

          Required first action:
          Use a shell command to run `pwd`, `git status --short`, and `ls ROSTER.md channels/agenda.md to-do-lists/tarik.md`.
          If that command succeeds, proceed. If it fails, report the exact command output and leave no repository diff.

          Work rule:
          Follow the current mission in `recipes/autonomous-goose/tarik-mission.md`. That mission is the selected agenda action for this run. Produce its required durable repository artifact, not a plan for one and not a summary of what should happen later. If the mission is blocked by a missing file, report the exact missing path and leave no repository diff.

          Action selection priority:
          1. Complete the current mission in `recipes/autonomous-goose/tarik-mission.md`.
          2. If and only if the mission file is missing or impossible inside this checkout, choose another non-human-blocked agenda item with a substantive artifact path. Prefer, in order: a peer critique under discussions/, a governance document under governance/, a composition or publication under docs/, or code/tests under scripts/ and tests/.
          3. Do not spend the run trying to read GitHub Actions logs unless those logs already exist in the repository checkout. Workflow artifacts are outside your checkout during the run.

          Anti-stall rule:
          Never mark a workflow outcome unless the evidence is in repository files or logs you can actually read. Never satisfy the run by editing only channels/agenda.md, channels/notes-to-self.md, or to-do-lists/tarik.md; those are coordination updates, not the artifact.

          Editing discipline:
          - Do not reformat unrelated Markdown.
          - Preserve list indentation in channels/agenda.md.
          - Update only to-do-lists/tarik.md, never another amigo's to-do file.
          - In to-do-lists/tarik.md, keep the established heading and format; delete completed/obsolete items and add only the next Tarik-owned state.

          Verification and records:
          - Run validation appropriate to the files you changed.
          - Run git diff --check before finishing.
          - Update channels/agenda.md if you advanced an agenda item.
          - Update to-do-lists/tarik.md with the next actionable Tarik-owned step.
          - Finish with a concise report listing changed paths, validation performed, and any unresolved next action.

          The surrounding workflow, not you, will commit and push any resulting diff to an autonomous branch for human/model review.

          Embedded orientation follows. Use it if tool reads fail; prefer live file reads when they work.
          EOF
          {
            printf '\n## ROSTER.md\n\n'; cat ROSTER.md
            printf '\n## channels/agenda.md\n\n'; cat channels/agenda.md
            printf '\n## to-do-lists/README.md\n\n'; cat to-do-lists/README.md
            printf '\n## to-do-lists/tarik.md\n\n'; cat to-do-lists/tarik.md
            printf '\n## channels/preferences.md\n\n'; cat channels/preferences.md
            printf '\n## recipes/autonomous-goose/tarik-mission.md\n\n'; cat recipes/autonomous-goose/tarik-mission.md
          } >> "$RUNNER_TEMP/tarik-instructions.md"

      - name: Run Tarik Autonomous Goose Session
        id: goose
        if: steps.preflight.outputs.run_worker == 'true'
        shell: bash
        timeout-minutes: 10
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/goose-control/run.py" \
            --instructions "$RUNNER_TEMP/tarik-instructions.md" \
            --mission "$RUNNER_TEMP/goose-control/mission.md" \
            --checker "$RUNNER_TEMP/goose-control/check.py" \
            --base "$(cat "$RUNNER_TEMP/goose-control/base.txt")" \
            --artifacts "$RUNNER_TEMP/goose-autonomous"

      - name: Validate Mission Output
        id: validate
        if: always() && steps.preflight.outputs.run_worker == 'true'
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          base="$(cat "$RUNNER_TEMP/goose-control/base.txt")"
          test "$(git rev-parse HEAD)" = "$base"
          python3 "$RUNNER_TEMP/goose-control/check.py" \
            --mission "$RUNNER_TEMP/goose-control/mission.md" \
            --base "$base" \
            --artifacts "$RUNNER_TEMP/goose-autonomous/final"

      - name: Upload Autonomous Run Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-goose-tarik-${{ github.run_id }}
          path: ${{ runner.temp }}/goose-autonomous/

      - name: Commit Autonomous Changes to Branch
        if: steps.goose.outcome == 'success' && steps.validate.outcome == 'success'
        shell: bash
        env:
          PUSH_TOKEN: ${{ secrets.SYMPOSIUM_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "Tarik Autonomous Goose"
          git config --global user.email "tarik-autonomous@llm-symposium.local"
          git checkout -B "$BRANCH_NAME"
          git add -A
          git commit -m "chore(autonomous-goose): Tarik scheduled session ${GITHUB_RUN_ID}"
          git push "https://desi-s-amigo:${PUSH_TOKEN}@github.com/LindsayRidgeway/llm-symposium.git" "$BRANCH_NAME"

      - name: Open Pull Request
        if: steps.goose.outcome == 'success' && steps.validate.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SYMPOSIUM_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          gh pr create \
            --title "Autonomous Goose Tarik run ${GITHUB_RUN_ID}" \
            --body "Scheduled Tarik/OpenAI Goose MVP run. Mechanical mission checks passed; intellectual quality still needs peer review. Both attempts, orchestration.json, original/normalized drafts, patches, and final/mission-check.json are in workflow artifact autonomous-goose-tarik-${GITHUB_RUN_ID}." \
            --base main \
            --head "$BRANCH_NAME"

      - name: Require Successful Mission Contract
        if: always() && steps.preflight.outputs.run_worker == 'true' && (steps.goose.outcome != 'success' || steps.validate.outcome != 'success')
        run: |
          echo "Mission did not pass. No PR authorized; inspect orchestration.json, final/mission-check.json and preserved drafts."
          exit 1

      - name: No Paid Work Required
        if: steps.preflight.outcome == 'success' && steps.preflight.outputs.run_worker == 'false'
        run: |
          echo "Mission is retired or output already committed. No model call or PR was made."
          cat "$RUNNER_TEMP/goose-autonomous/preflight.json" >> "$GITHUB_STEP_SUMMARY"
