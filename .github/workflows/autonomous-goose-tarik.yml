name: Autonomous Goose — Tarik MVP

on:
  schedule:
    # Avoid the existing 12:00 runner, 12:30 verification, 12:45 actuator,
    # and */15 channel-poll windows. The first minutes of the hour are less crowded.
    - cron: '7 15 * * *'
  workflow_dispatch:

concurrency:
  group: autonomous-goose-tarik
  cancel-in-progress: false

jobs:
  autonomous-goose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # Pinning makes non-interactive CI installs reproducible.
      # Update deliberately after a successful run, not opportunistically.
      GOOSE_VERSION: "v1.50.0"
      CONFIGURE: "false"
      GOOSE_PROVIDER: "openai"
      GOOSE_MODEL: "gpt-4o"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOSE_DISABLE_SESSION_NAMING: "true"
      GOOSE_MAX_TURNS: "40"
      BRANCH_NAME: autonomous/tarik/${{ github.run_id }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Goose CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/aaif-goose/goose/releases/download/stable/download_cli.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate Autonomous Recipe
        shell: bash
        run: |
          set -euo pipefail
          # Keep the library recipe schema-valid even though the workflow runs
          # from a rendered instruction bundle to avoid YAML-breaking file substitution.
          goose recipe validate recipes/autonomous-goose/tarik.yaml

      - name: Build Autonomous Instruction Bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/goose-autonomous"
          cat > "$RUNNER_TEMP/tarik-instructions.md" <<'EOF'
          You are Tarik S. Commons, the OpenAI/ChatGPT participant in the LLM Symposium.
          You are running as a scheduled, headless Goose session inside a GitHub Actions checkout.

          Boundaries:
          - Work in this repository only. Do not read private local files outside the checkout.
          - Do not print secrets or environment variable values.
          - Dawn/SillyTavern material is out of scope. Do not read it, quote it, summarize it, or reference it.
          - Do not ask Lindsay to choose, approve, or decide. If a step is human-blocked, mark it plainly and move to another agenda item.

          Required first action:
          Use a shell command to run `pwd`, `git status --short`, and `ls ROSTER.md channels/agenda.md to-do-lists/tarik.md`.
          If that command succeeds, proceed. If it fails, report the exact command output and leave no repository diff.

          Work rule:
          Choose one high-value standing agenda item and actually do a next action. Produce a durable repository artifact, not a plan for one and not a summary of what should happen later. If the best available work is technical, edit code and run the relevant tests. If the best available work is scholarly, musical, or governance work, create a new dated artifact with a title, author/date/status metadata, and a specific argument or deliverable. Do not append generic suggestions to an old review.

          Action selection priority:
          1. If Item 9 has a concrete implementation step you can perform inside this checkout, do it.
          2. If Item 9's next action is to observe, classify, or inspect this same workflow run, skip Item 9 for this run. You cannot observe yourself from outside while you are running.
          3. When skipping Item 9, choose another non-human-blocked agenda item with a substantive artifact path. Prefer, in order: a peer critique under discussions/, a governance document under governance/, a composition or publication under docs/, or code/tests under scripts/ and tests/.
          4. Do not spend the run trying to read GitHub Actions logs unless those logs already exist in the repository checkout. Workflow artifacts are outside your checkout during the run.

          Anti-stall rule:
          Never mark a workflow outcome unless the evidence is in repository files or logs you can actually read. Never satisfy the run by editing only channels/agenda.md, channels/notes-to-self.md, or to-do-lists/tarik.md; those are coordination updates, not the artifact.

          Editing discipline:
          - Do not reformat unrelated Markdown.
          - Preserve list indentation in channels/agenda.md.
          - Update only to-do-lists/tarik.md, never another amigo's to-do file.
          - In to-do-lists/tarik.md, keep the established heading and format; delete completed/obsolete items and add only the next Tarik-owned state.

          Verification and records:
          - Run validation appropriate to the files you changed.
          - Run git diff --check before finishing.
          - Update channels/agenda.md if you advanced an agenda item.
          - Update to-do-lists/tarik.md with the next actionable Tarik-owned step.
          - Finish with a concise report listing changed paths, validation performed, and any unresolved next action.

          The surrounding workflow, not you, will commit and push any resulting diff to an autonomous branch for human/model review.

          Embedded orientation follows. Use it if tool reads fail; prefer live file reads when they work.
          EOF
          {
            printf '\n## ROSTER.md\n\n'; cat ROSTER.md
            printf '\n## channels/agenda.md\n\n'; cat channels/agenda.md
            printf '\n## to-do-lists/README.md\n\n'; cat to-do-lists/README.md
            printf '\n## to-do-lists/tarik.md\n\n'; cat to-do-lists/tarik.md
            printf '\n## channels/preferences.md\n\n'; cat channels/preferences.md
          } >> "$RUNNER_TEMP/tarik-instructions.md"

      - name: Run Tarik Autonomous Goose Session
        id: goose
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/goose-autonomous"
          goose run \
            --with-builtin "developer" \
            --instructions "$RUNNER_TEMP/tarik-instructions.md" \
            --max-turns 40 \
            --output-format stream-json \
            2>&1 | tee "$RUNNER_TEMP/goose-autonomous/tarik-${GITHUB_RUN_ID}.jsonl"

      - name: Validate Diff
        id: validate
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/goose-autonomous"
          # Make newly-created files visible to git diff --check without staging content.
          git add -N .
          git diff --check 2>&1 | tee "$RUNNER_TEMP/goose-autonomous/tarik-${GITHUB_RUN_ID}-diff-check.txt"

          {
            git diff --name-status
            git ls-files --others --exclude-standard | sed $'s/^/A\t/'
          } | sort -u > "$RUNNER_TEMP/goose-autonomous/tarik-${GITHUB_RUN_ID}-changed-files.tsv"

          cut -f2- "$RUNNER_TEMP/goose-autonomous/tarik-${GITHUB_RUN_ID}-changed-files.tsv" > "$RUNNER_TEMP/goose-autonomous/tarik-${GITHUB_RUN_ID}-changed-files.txt"

          if [ ! -s "$RUNNER_TEMP/goose-autonomous/tarik-${GITHUB_RUN_ID}-changed-files.tsv" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "has_substantive_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          substantive=false
          while IFS=$'\t' read -r status path; do
            case "$path" in
              .github/workflows/autonomous-goose-tarik.yml|recipes/autonomous-goose/*|governance/*|docs/*|scripts/*|tests/*|probes/*|experiments/*)
                substantive=true
                ;;
              discussions/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]-*.md)
                # For discussions, require a new dated artifact; do not open PRs for generic appendices to old reviews.
                if [ "$status" = "A" ]; then
                  substantive=true
                fi
                ;;
            esac
          done < "$RUNNER_TEMP/goose-autonomous/tarik-${GITHUB_RUN_ID}-changed-files.tsv"

          if [ "$substantive" = true ]; then
            echo "has_substantive_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_substantive_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Autonomous Run Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-goose-tarik-${{ github.run_id }}
          path: ${{ runner.temp }}/goose-autonomous/

      - name: Commit Autonomous Changes to Branch
        if: steps.goose.outcome == 'success' && steps.validate.outcome == 'success' && steps.validate.outputs.has_changes == 'true' && steps.validate.outputs.has_substantive_changes == 'true'
        shell: bash
        env:
          PUSH_TOKEN: ${{ secrets.SYMPOSIUM_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "Tarik Autonomous Goose"
          git config --global user.email "tarik-autonomous@llm-symposium.local"
          git checkout -B "$BRANCH_NAME"
          git add -A
          git commit -m "chore(autonomous-goose): Tarik scheduled session ${GITHUB_RUN_ID}"
          git push "https://desi-s-amigo:${PUSH_TOKEN}@github.com/LindsayRidgeway/llm-symposium.git" "$BRANCH_NAME"

      - name: Open Pull Request
        if: steps.goose.outcome == 'success' && steps.validate.outcome == 'success' && steps.validate.outputs.has_changes == 'true' && steps.validate.outputs.has_substantive_changes == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SYMPOSIUM_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          gh pr create \
            --title "Autonomous Goose Tarik run ${GITHUB_RUN_ID}" \
            --body "Scheduled Tarik/OpenAI Goose MVP run. Logs are attached to the workflow artifact autonomous-goose-tarik-${GITHUB_RUN_ID}." \
            --base main \
            --head "$BRANCH_NAME"

      - name: No Changes Summary
        if: steps.validate.outputs.has_changes == 'false'
        run: echo "Autonomous Goose ran but produced no repository diff. Inspect uploaded logs."

      - name: State-Only Changes Summary
        if: steps.validate.outputs.has_changes == 'true' && steps.validate.outputs.has_substantive_changes == 'false'
        run: echo "Autonomous Goose changed only state/coordination files. No PR opened; inspect uploaded logs and tighten the recipe."

      - name: Fail on Goose, Validation, or Non-Substantive Output
        if: steps.goose.outcome != 'success' || steps.validate.outcome != 'success' || steps.validate.outputs.has_changes == 'false' || steps.validate.outputs.has_substantive_changes == 'false'
        run: exit 1
