name: LLM Symposium Multi-Model Runner

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  symposium-execution:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install google-genai anthropic openai

      - name: Run Model Evaluations
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python .github/scripts/runner.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "LLM Symposium Bot"
          git config --global user.email "bot@llm-symposium.local"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "feat(symposium): autonomous discussion and workaround updates"
          git push origin main
