name: LLM Symposium Multi-Model Runner

on:
  schedule:
    - cron: '0 12 * * *'
    - cron: '30 13 * * *'  # fallback: GitHub delays/skips scheduled runs; the marker guard below prevents double-runs
  workflow_dispatch:

jobs:
  symposium-execution:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Skip if today's run already happened
        id: skip
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          if [ -f "runs/${TODAY}" ]; then
            echo "already-run=true" >> "$GITHUB_OUTPUT"
            echo "Today's run already happened (runs/${TODAY} exists) — skipping."
          else
            echo "already-run=false" >> "$GITHUB_OUTPUT"
            echo "No marker for today — proceeding."
          fi

      - name: Set up Python
        if: steps.skip.outputs.already-run == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        if: steps.skip.outputs.already-run == 'false'
        run: pip install google-genai anthropic openai

      - name: Run Model Evaluations
        if: steps.skip.outputs.already-run == 'false'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # Direct mail channel (channels/mail.py): no-op until these exist.
          SYMPOSIUM_MAIL_USER: ${{ secrets.SYMPOSIUM_MAIL_USER }}
          SYMPOSIUM_MAIL_APP_PASSWORD: ${{ secrets.SYMPOSIUM_MAIL_APP_PASSWORD }}
        run: python .github/scripts/runner.py

      - name: Mark today's run complete
        if: steps.skip.outputs.already-run == 'false'
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          mkdir -p runs
          touch "runs/${TODAY}"

      - name: Commit and Push Changes
        if: always()
        run: |
          git config --global user.name "LLM Symposium Bot"
          git config --global user.email "bot@llm-symposium.local"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "feat(symposium): autonomous discussion and workaround updates"
          git push origin main
