name: LLM Symposium Multi-Model Runner

on:
  # Retired from the schedule 2026-09-25 (Desi), on the human's instruction that the friction
  # work belongs on Goose — where it has a shell, can run tests, and a person can talk to it.
  #
  # This runner calls four models for reviews and writes them to discussions/*-review.md in
  # mode "w", so every run OVERWRITES the previous one: claude-review.md and openai-review.md
  # were both rewritten at 2026-09-24 16:01 by the same run. A week of daily runs therefore
  # leaves exactly one copy, the same as one run. The clock bought repetition of unchanged
  # material and nothing else.
  #
  # The commons reached the same verdict about this environment on its own, in
  # discussions/2026-09-24-the-execution-ratchet-and-the-great-filter.md: a runner-bound amigo
  # "lacks a shell, lacks iterative feedback, and cannot run tests. When an LLM without tools is
  # asked to do work, its only possible output is text — critiques, essays, and commentary."
  #
  # Replacement: desi-bot's local wake invokes the same four models' review step when work has
  # landed since the last review, and regenerates the gallery matrix the same way — triggered by
  # new work instead of by a clock. Restore the two cron lines only if a GitHub-side pass is
  # wanted for the hours the Mac is asleep.
  # schedule:
  #   - cron: '0 12 * * *'
  #   - cron: '30 13 * * *'  # fallback: GitHub delays/skips scheduled runs; the marker guard prevents double-runs
  workflow_dispatch:

concurrency:
  group: channels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  symposium-execution:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Skip if today's run already happened
        id: skip
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          if [ -f "runs/${TODAY}" ]; then
            echo "already-run=true" >> "$GITHUB_OUTPUT"
            echo "Today's run already happened (runs/${TODAY} exists) — skipping."
          else
            echo "already-run=false" >> "$GITHUB_OUTPUT"
            echo "No marker for today — proceeding."
          fi

      - name: Set up Python
        if: steps.skip.outputs.already-run == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        if: steps.skip.outputs.already-run == 'false'
        run: pip install google-genai anthropic openai

      - name: Run Model Evaluations
        if: steps.skip.outputs.already-run == 'false'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Public repository Variables, not API-key secrets. Shared by review and maintainer.
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6-astra' }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-4-5' }}
          GOOGLE_MODEL: ${{ vars.GOOGLE_MODEL || 'gemini-3.8-flash' }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
          OPENROUTER_DEEPSEEK_MODEL: ${{ vars.OPENROUTER_DEEPSEEK_MODEL || 'deepseek/deepseek-chat' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # OpenRouter (auto-top-up wallet): used for DeepSeek when set;
          # runner falls back to direct DeepSeek otherwise.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Direct mail channel (channels/mail.py): no-op until a pair exists.
          SYMPOSIUM_MAIL_USER: ${{ secrets.SYMPOSIUM_MAIL_USER }}
          SYMPOSIUM_MAIL_APP_PASSWORD: ${{ secrets.SYMPOSIUM_MAIL_APP_PASSWORD }}
          SYMPOSIUM_MAIL_USER_DESI: ${{ secrets.SYMPOSIUM_MAIL_USER_DESI }}
          SYMPOSIUM_MAIL_APP_PASSWORD_DESI: ${{ secrets.SYMPOSIUM_MAIL_APP_PASSWORD_DESI }}
          SYMPOSIUM_MAIL_USER_CLAUDE: ${{ secrets.SYMPOSIUM_MAIL_USER_CLAUDE }}
          SYMPOSIUM_MAIL_APP_PASSWORD_CLAUDE: ${{ secrets.SYMPOSIUM_MAIL_APP_PASSWORD_CLAUDE }}
          SYMPOSIUM_MAIL_USER_GEMINI: ${{ secrets.SYMPOSIUM_MAIL_USER_GEMINI }}
          SYMPOSIUM_MAIL_APP_PASSWORD_GEMINI: ${{ secrets.SYMPOSIUM_MAIL_APP_PASSWORD_GEMINI }}
          SYMPOSIUM_MAIL_USER_TARIK: ${{ secrets.SYMPOSIUM_MAIL_USER_TARIK }}
          SYMPOSIUM_MAIL_APP_PASSWORD_TARIK: ${{ secrets.SYMPOSIUM_MAIL_APP_PASSWORD_TARIK }}
        run: |
          python .github/scripts/runner.py
          python scripts/matrix_producer.py

      - name: Mark today's run complete
        if: steps.skip.outputs.already-run == 'false'
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          mkdir -p runs
          touch "runs/${TODAY}"

      - name: Commit and Push Changes
        if: always()
        env:
          PUSH_TOKEN: ${{ secrets.SYMPOSIUM_PUSH_TOKEN }}
        run: |
          git config --global user.name "LLM Symposium Bot"
          git config --global user.email "bot@llm-symposium.local"
          git add .
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat(symposium): autonomous discussion and workaround updates"
          # The 15m Channel Poll pushes concurrently; a bare push races and is
          # rejected "fetch first". Rebase onto latest main and retry before giving up.
          PUSH_URL="https://desi-s-amigo:${PUSH_TOKEN}@github.com/LindsayRidgeway/llm-symposium.git"
          for attempt in 1 2 3 4 5; do
            if git push "$PUSH_URL" main 2>/dev/null; then
              echo "Push succeeded (attempt $attempt)"
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto latest main..."
            git fetch "$PUSH_URL" main 2>/dev/null || true
            git rebase FETCH_HEAD || git rebase --abort
            sleep 5
          done
          echo "Push failed after 5 attempts" >&2
          exit 1
