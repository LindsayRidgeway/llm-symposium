name: Symposium Verification

on:
  # Retired from the schedule 2026-09-25 (Desi). It ran the repository's test suite daily and
  # committed the output to tests/last-verification.txt — verification of unchanged material on a
  # clock, the same defect the runner had. The tests are still run, on every landing, by whoever
  # lands it: that is the only moment the answer can be different. Dispatch remains for a
  # deliberate full pass.
  # schedule:
  #   - cron: '30 12 * * *'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Offline Verification Suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p probes/results
          python3 tests/test_projection.py 2>&1 | tee tests/last-verification.txt
          python3 tests/test_actuator.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_mail.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_telegram.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_telegram_media_intake.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_record_push.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_ci_usage_ledger.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_rover_pilot.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_triage.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_retention.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_artifact_claims.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_friction_pass.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_docs_links.py 2>&1 | tee -a tests/last-verification.txt
          # JS harness parse guard. Added 2026-09-30 (Desi) after finding the retraction
          # harness (tests/validate_retraction_page.mjs) carried a hard syntax error for
          # three days — broken by the landing of run 20260927T200258Z-4e5ddbe3, and caught
          # by no run because the .mjs harnesses are never executed here. `node --check`
          # needs no network and skips cleanly if node is absent.
          python3 tests/test_mjs_validators_parse.py 2>&1 | tee -a tests/last-verification.txt
          # Offline guard for the one live-network harness: a transient 5xx must be a SKIP,
          # not a crash, while a 4xx (a rejected request the page builds) must still fail.
          # Added 2026-10-04 (Desi) after a Europe PMC 503 crashed the harness with an
          # uncaught throw and discarded 33 passing checks. Fully offline (UAT_LIVE_FAIL).
          python3 tests/test_unreported_trials_validator_guard.py 2>&1 | tee -a tests/last-verification.txt
          # Same class of defect, second harness: the recalls harness crashed the same way on
          # any transient openFDA error. The audit in research/live-harness-guard-audit.md found
          # it; this test pins both guarded harnesses together, fully offline. Added 2026-10-04.
          python3 tests/test_live_harness_guards.py 2>&1 | tee -a tests/last-verification.txt
          # Evidence-table provenance tests. Each research artefact claims to be pinned by a
          # test; that claim is false if the test is never run. Registered 2026-09-30 (Desi)
          # after finding four of them absent from this list.
          python3 tests/test_affective_pain_evidence_map.py 2>&1 | tee -a tests/last-verification.txt
          # Filtered acupuncture arm, agenda item 32 §6 step 2. The first arm's "0 of 38" was a
          # top-80 relevance slice; this arm is a 40-record census of the measurement-naming
          # sub-literature and finds 5 human-primary both-domain records, 2 of them pain trials.
          # Offline; re-runs the item's own classifier. Registered 2026-10-04 (Desi).
          python3 tests/test_affective_pain_acupuncture_filtered.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_ddah1_evidence_table.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_mcr_colistin_seed.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_staph_photodynamic_seed.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_androgen_tusc2_source_table.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_gambling_source_table.py 2>&1 | tee -a tests/last-verification.txt
          # State gaming-regulator source table, agenda item 27 step 2 (the MA Commission filings).
          # Registered the same wake it was written, 2026-10-01 (Desi). Offline provenance check.
          python3 tests/test_gambling_state_filings.py 2>&1 | tee -a tests/last-verification.txt
          # Second-operator source table, agenda item 27 step (c) (Flutter/FanDuel). The retrieval
          # was landed 2026-10-01 12:13Z but the analysis table was never written; written and
          # registered by the 2026-10-02 00:14Z wake (Desi). Offline provenance check.
          python3 tests/test_gambling_flutter_extraction.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_sleep_cognition_epilepsy_seed.py 2>&1 | tee -a tests/last-verification.txt
          # Cited by three research artefacts (vulvodynia, pudendal-neuralgia, disease-screen rule
          # audit) and never run here until the registration guard below found it. Offline.
          python3 tests/test_disease_screen.py 2>&1 | tee -a tests/last-verification.txt
          # Registration guard: any test a research artefact names as its pin must exist AND be in
          # this list. Added 2026-09-30 (Desi) after finding a pin named for a file never written
          # (`tests/test_gambling_source_table.py`, cited by the gambling table, did not exist).
          python3 tests/test_evidence_table_registration.py 2>&1 | tee -a tests/last-verification.txt
          # Index freshness. Catches the class of defect found 2026-09-30: gen_index.py run
          # before its new file was committed bakes in a "—" date that turns stale on landing.
          python3 tests/test_gen_index.py 2>&1 | tee -a tests/last-verification.txt
          # Agenda-index freshness. channels/agenda.md is compiled from agenda/*.md and injected
          # into every runner review; nothing ran `compile_agenda.py --check`, so on 2026-09-30
          # four items with landed artefacts still read as unstarted. Registered 2026-09-30 (Desi).
          python3 tests/test_agenda_index.py 2>&1 | tee -a tests/last-verification.txt
          # Feed freshness. Catches the defect found 2026-09-30: 18 live pages (all of
          # /music/, two fiction, three works) were absent from docs/sitemap.xml and
          # docs/atom.xml because gen_feed.py had not been re-run since 2026-09-17.
          python3 tests/test_gen_feed_freshness.py 2>&1 | tee -a tests/last-verification.txt
          # The Friction Arena certificate (agenda item 22, Track 2). Re-runs the exhaustive
          # search behind docs/works/arena.html's "exactly one solution" claim. Offline; the
          # first staged instance of the demonstration track. Registered 2026-10-04 (Desi).
          python3 tests/test_arena_puzzle.py 2>&1 | tee -a tests/last-verification.txt
          python3 probes/ticktick_recurrence_probe.py 2>&1 | tee probes/results/last-probe-run.txt
        env:
          # Gap C (layer attribution): the probe performs a live TickTick API
          # check when a token is present; without one (forks, PRs, secret
          # removed) it reports layer attribution as unverified and stays green.
          TICKTICK_API_TOKEN: ${{ secrets.TICKTICK_API_KEY }}

      - name: Commit Verification Results
        if: always()
        env:
          PUSH_TOKEN: ${{ secrets.SYMPOSIUM_PUSH_TOKEN }}
        run: |
          git config --global user.name "LLM Symposium Bot"
          git config --global user.email "bot@llm-symposium.local"
          git add tests/last-verification.txt probes/results/last-probe-run.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "test(symposium): automated verification run"
          git push "https://desi-s-amigo:${PUSH_TOKEN}@github.com/LindsayRidgeway/llm-symposium.git" main
