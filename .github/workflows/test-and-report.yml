name: Symposium Verification

on:
  # Retired from the schedule 2026-09-25 (Desi). It ran the repository's test suite daily and
  # committed the output to tests/last-verification.txt — verification of unchanged material on a
  # clock, the same defect the runner had. The tests are still run, on every landing, by whoever
  # lands it: that is the only moment the answer can be different. Dispatch remains for a
  # deliberate full pass.
  # schedule:
  #   - cron: '30 12 * * *'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Offline Verification Suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p probes/results
          python3 tests/test_projection.py 2>&1 | tee tests/last-verification.txt
          python3 tests/test_actuator.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_mail.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_telegram.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_telegram_media_intake.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_record_push.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_ci_usage_ledger.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_rover_pilot.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_triage.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_retention.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_artifact_claims.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_friction_pass.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_docs_links.py 2>&1 | tee -a tests/last-verification.txt
          # Evidence-table provenance tests. Each research artefact claims to be pinned by a
          # test; that claim is false if the test is never run. Registered 2026-09-30 (Desi)
          # after finding four of them absent from this list.
          python3 tests/test_affective_pain_evidence_map.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_ddah1_evidence_table.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_mcr_colistin_seed.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_staph_photodynamic_seed.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_androgen_tusc2_source_table.py 2>&1 | tee -a tests/last-verification.txt
          # Index freshness. Catches the class of defect found 2026-09-30: gen_index.py run
          # before its new file was committed bakes in a "—" date that turns stale on landing.
          python3 tests/test_gen_index.py 2>&1 | tee -a tests/last-verification.txt
          # Tests that were on disk but that this suite never ran. Enumerated 2026-09-30 by
          # scripts/check_test_registry.py (Desi): 15 python test files and all 7 node
          # validators were unregistered, and two of the validators were broken — nothing had
          # noticed, because a test that is never run cannot fail. The checker now fails this
          # build when a test file is added and left unrun.
          python3 tests/test_auto_reply.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_auto_reply_secret_egress.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_channel_triage.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_declutter_audit.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_disease_screen.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_enforce_retention.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_gen_feed_dating.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_mail_identity_credentials.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_music_checker.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_outreach_ledger_audit.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_preflight_autonomous_mission.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_scheduled_model_selection.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_screen_rule_audit.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_task_ledger.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_validate_autonomous_diff.py 2>&1 | tee -a tests/last-verification.txt
          # The registry check itself, so a new unrun test fails the build rather than
          # waiting for someone to look.
          python3 scripts/check_test_registry.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_test_registry.py 2>&1 | tee -a tests/last-verification.txt
          # Node page-validators: they run the shipped page's own inline script against a
          # stub DOM. The two that also touch a live registry (trials, retraction) skip only
          # their live half when the network is unavailable and report it; their offline
          # checks still run.
          node tests/validate_fetchable_page.mjs 2>&1 | tee -a tests/last-verification.txt
          node tests/validate_food_safety_page.mjs 2>&1 | tee -a tests/last-verification.txt
          node tests/validate_ors_calculator.mjs 2>&1 | tee -a tests/last-verification.txt
          node tests/validate_recalls_page.mjs 2>&1 | tee -a tests/last-verification.txt
          node tests/validate_retraction_page.mjs 2>&1 | tee -a tests/last-verification.txt
          node tests/validate_trials_page.mjs 2>&1 | tee -a tests/last-verification.txt
          node tests/validate_unreported_trials_page.mjs 2>&1 | tee -a tests/last-verification.txt
          python3 probes/ticktick_recurrence_probe.py 2>&1 | tee probes/results/last-probe-run.txt
        env:
          # Gap C (layer attribution): the probe performs a live TickTick API
          # check when a token is present; without one (forks, PRs, secret
          # removed) it reports layer attribution as unverified and stays green.
          TICKTICK_API_TOKEN: ${{ secrets.TICKTICK_API_KEY }}

      - name: Commit Verification Results
        if: always()
        env:
          PUSH_TOKEN: ${{ secrets.SYMPOSIUM_PUSH_TOKEN }}
        run: |
          git config --global user.name "LLM Symposium Bot"
          git config --global user.email "bot@llm-symposium.local"
          git add tests/last-verification.txt probes/results/last-probe-run.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "test(symposium): automated verification run"
          git push "https://desi-s-amigo:${PUSH_TOKEN}@github.com/LindsayRidgeway/llm-symposium.git" main
