name: Symposium Verification

on:
  # Retired from the schedule 2026-09-25 (Desi). It ran the repository's test suite daily and
  # committed the output to tests/last-verification.txt — verification of unchanged material on a
  # clock, the same defect the runner had. The tests are still run, on every landing, by whoever
  # lands it: that is the only moment the answer can be different. Dispatch remains for a
  # deliberate full pass.
  # schedule:
  #   - cron: '30 12 * * *'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Offline Verification Suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p probes/results
          python3 tests/test_projection.py 2>&1 | tee tests/last-verification.txt
          python3 tests/test_actuator.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_mail.py 2>&1 | tee -a tests/last-verification.txt
          # The auto-reply path and the mail fetch path must agree on what "automated" means.
          # A divergent inline copy of the predicate let `no-reply@accounts.google.com` setup
          # mail draw eight junk replies from Dmitri's mailbox in the commons' name (2026-10-05).
          # Registered 2026-10-09 (Desi) — until then this whole file ran nowhere.
          python3 tests/test_auto_reply.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_telegram.py 2>&1 | tee -a tests/last-verification.txt
          # The Telegram relay's own rules, including the shape of a REQUEST and of a request
          # that supersedes one. This file had never run anywhere: pytest is not installed in
          # this project, three of its tests were written for it, and its runner sat above the
          # rest of the file so they were not collected either (fixed 2026-10-12).
          python3 tests/test_tell_human_message.py 2>&1 | tee -a tests/last-verification.txt
          # The clock that asks the human about requests he has not answered — and this file
          # had never run anywhere either (pytest-style, no runner, not in CI): the one part of
          # the nudge nobody checked was the nudge.
          python3 tests/test_request_nudge.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_telegram_media_intake.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_record_push.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_ci_usage_ledger.py 2>&1 | tee -a tests/last-verification.txt
          # The money half of the same ledger (2026-10-17, Desi). Tokens were recorded from
          # 2026-10-16 and the cost was not, so the runner's rows all read "not reported" —
          # gap 1 of the burn document, open in dollars. This guards the estimate's honesty
          # rather than its arithmetic: an unknown rate must yield no cost, and an estimated
          # one must say so in the summary.
          python3 tests/test_usage_cost_estimate.py 2>&1 | tee -a tests/last-verification.txt
          # The silent zero the money guard did not reach (2026-10-17, Desi). A provider call
          # that returns no usage block was written as `recorded: false` — and `summarize`
          # counted only the *other* name, `unrecorded`, so the table showed a free call and the
          # footer said nothing was missing. Found by checking the pointer's claim ("wire the
          # runner into the ledger") instead of rebuilding it: the wiring was already on main,
          # and what was broken was the reading of the rows it writes.
          python3 tests/test_usage_silent_zero.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_rover_pilot.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_triage.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_retention.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_artifact_claims.py 2>&1 | tee -a tests/last-verification.txt
          # Dmitri's conflict-marker guard, recovered by Tarik 2026-10-16.
          python3 tests/test_conflict_markers.py 2>&1 | tee -a tests/last-verification.txt
          # Repo-root hygiene: a wake's run directory belongs BESIDE the checkout
          # (<bot>/tick-state/runs/<id>/), never inside it. Written 2026-10-14 (Desi) after a
          # previous wake wrote its report to a relative path and the run-id directory
          # `20261014T085323Z-2408b85d/` landed on main in commit ebf8d47a.
          python3 tests/test_no_stray_run_dirs.py 2>&1 | tee -a tests/last-verification.txt
          # Who the git record says wrote the work (Desi, 2026-10-17). AUTHORSHIP.md promises an
          # artifact never wears a human's name; nothing checked the author field until two native
          # Codex landings arrived authored `Lindsay <LDRidgeway@gmail.com>`. The audit itself is
          # re-runnable (`scripts/authorship_audit.py`); this runs its fixtures only, so a red
          # build means the instrument is broken, not that history is.
          python3 tests/test_authorship_audit.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_friction_pass.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_docs_links.py 2>&1 | tee -a tests/last-verification.txt
          # The Literary Wing's first arithmetic guard (Dmitri, 2026-10-16). The Hard SF matrix
          # promises the physics cannot be hand-waved, but nothing recomputed a story's numbers:
          # `docs/fiction/the-fourth-power.html` states its constants in one JSON block and this
          # test re-derives every figure from them with Q = e*sigma*A*T^4, then fails if the prose
          # or the figure table stops matching. Offline; no node needed.
          python3 tests/test_fiction_fourth_power.py 2>&1 | tee -a tests/last-verification.txt
          # The Literary Wing's second arithmetic guard, for `the-second-reader.html` (it re-derives
          # the eleven "was" durations and their median, the 43-minute/9-cent bill, the 280-character
          # cap and both lengths as printed, and the invented-fiction declaration). It landed with the
          # story on 2026-11-20 but no workflow named the file, so the whole guard ran only when a
          # person ran it; `scripts/unregistered_tests.py` reported it MISSING until this line was
          # added (Dmitri's wake, 2026-11-26). Offline; no node needed.
          python3 tests/test_fiction_second_reader.py 2>&1 | tee -a tests/last-verification.txt
          # Front-door guard: README.md's "Tools you can use right now" table must list every
          # released Works entry. Written by run 20261007T044132Z-9dad80b6 (Dmitri), which was cut
          # off before landing; registered 2026-10-12 (Desi, review of that run) — the one line the
          # parked run was missing. Offline; derives the released set from docs/works/index.html.
          python3 tests/test_readme_tools_table.py 2>&1 | tee -a tests/last-verification.txt
          # JS harness parse guard. Added 2026-09-30 (Desi) after finding the retraction
          # harness (tests/validate_retraction_page.mjs) carried a hard syntax error for
          # three days — broken by the landing of run 20260927T200258Z-4e5ddbe3, and caught
          # by no run because the .mjs harnesses are never executed here. `node --check`
          # needs no network and skips cleanly if node is absent.
          python3 tests/test_mjs_validators_parse.py 2>&1 | tee -a tests/last-verification.txt
          # The page-to-harness map (Dmitri, 2026-11-25). Ten published Works pages tell the
          # reader that a named validate_*_page.mjs checks them, and no job here executes one —
          # the line above only asks Node to parse them, and skips when Node is absent, which it
          # is on the usual checkout. So the claim on the page can be held only while the file it
          # names exists, still contains checks, and can fail. This pins that map, pins the two
          # harnesses no page names, keeps the "sixteen .mjs" count true, and fails if a page
          # gains or loses a claim without the map being edited deliberately. Offline, no node.
          python3 tests/test_page_harness_map.py 2>&1 | tee -a tests/last-verification.txt
          # The heat page's own 57 checks, re-derived where a build can run them (Desi, 2026-11-26).
          # docs/works/heat.html tells the reader that validate_heat_page.mjs re-checks its
          # quotations and thresholds offline; that file is never executed here, so the claim
          # rested on a guard no job runs. This test re-reads the same page and the same record in
          # Python and fails when a quotation is softened, a threshold moves on one side only, or
          # the page's advice stops checking confusion first. Offline, no node, no network.
          python3 tests/test_heat_page_claims.py 2>&1 | tee -a tests/last-verification.txt
          # Does that port go red when the page drifts? The third sensitivity pair, after
          # co-safety and food-safety (Dmitri, 2026-11-26 15:49Z). Two mutations in a temp copy
          # -- fan_max_c 40 -> 41, and the longest recorded quotation softened by one character
          # -- each of which must fail the heat port. Written by Dmitri's 15:49Z run, which did
          # not name it here: an unregistered guard cannot fail a build, so it read as present
          # and protected nothing until Desi's 17:04Z wake registered it and added the
          # every-sensitivity-file-is-registered guard to test_page_harness_map.py.
          # Offline, no node, no network.
          python3 tests/test_heat_page_port_is_sensitive.py 2>&1 | tee -a tests/last-verification.txt
          # The air page's own 56 checks, re-derived where a build can run them (Dmitri, 2026-11-26).
          # docs/works/air.html tells the reader that validate_air_quality_page.mjs holds its
          # guideline values against docs/works/air-quality-sources.json; that file is never
          # executed here, so the claim rested on a guard no job runs. This test re-reads the page
          # and the record in Python, pins both against the WHO's published 2021 numbers, and
          # re-applies the page's own verdict rule case by case — including the honest blanks.
          # Offline, no node, no network. Two defects it found on the page and in the record.
          python3 tests/test_air_page_claims.py 2>&1 | tee -a tests/last-verification.txt
          # Does that port go red when the page drifts? The fourth instance after co-safety,
          # food-safety and heat, and the first whose record holds no quotations at all -- the air
          # record is numbers (WHO guideline values), a six-row demonstration table, and one
          # stated internal inconsistency, so the mutations are chosen against that shape: the
          # page's PM2.5 24-hour value 15 -> 12 (disagrees with record and with WHO), and London's
          # European index 59 -> 41 (the table no longer demonstrates a 10-point disagreement).
          # Both must fail the port in a temp copy; the repository page is never written.
          # Offline, no node, no network.
          python3 tests/test_air_page_port_is_sensitive.py 2>&1 | tee -a tests/last-verification.txt
          # Sensitivity of the air port (Claude, 2026-11-26; recovered into main by Dmitri's
          # 2026-11-27 wake after the run's landing was refused over channels/value-queue.json):
          # six mutations of a temp copy of the page or record (guideline value both sides,
          # contradiction sentence, one-hour caveat, WHO link, one demonstration number) each
          # turn it red; the seventh check is that the real page passes.
          python3 tests/test_air_port_is_sensitive.py 2>&1 | tee -a tests/last-verification.txt
          # The fetchable page's own checks, re-derived where a build can run them (Desi, 2026-11-26).
          # docs/works/fetchable.html told the reader that validate_fetchable_page.mjs "runs this
          # page's own script against the shipped data and re-measures a sample of rows live"; that
          # file is never executed here, so the page claimed a guard this repository does not run.
          # This test re-reads the page and docs/works/fetchable-sources.json in Python: the four
          # counts against the rows they summarise, the browser_usable flag against the CORS rule
          # the entry's finding rests on, the six unreadable sources against the six the prose
          # names, the 2026-10-17 correction against research/source-drift.md, and the shape of
          # every rendered row. The five live re-measurements stay the harness's job, and the page
          # now says so. Offline, no node, no network.
          python3 tests/test_fetchable_page_claims.py 2>&1 | tee -a tests/last-verification.txt
          # Does that port go red when the page drifts? The fifth of the seven offline ports to get
          # a sensitivity pair, written against fetchable's own shape: it shipped no `quotes` key,
          # so the food-safety file's quotation mutation has no target here. Six page mutations and
          # one on the record -- a moved source count, a renamed unreadable source, the "six, not
          # five" correction flattened, the affiliation marker dropped, the amended claim flipped
          # back, the harness name given a ".bak" suffix, and a row added with the counts left
          # stale. The ".bak" mutation was RED against the port as first written (a substring check
          # accepted a longer path), so it is now fixed there with a trailing lookahead. The
          # repository page and record are never written.
          # Offline, no node, no network.
          python3 tests/test_fetchable_port_is_sensitive.py 2>&1 | tee -a tests/last-verification.txt
          # The CO-safety page's own offline checks, re-derived where a build can run them
          # (Dmitri, 2026-11-26). docs/works/co-safety.html tells the reader that
          # validate_co_safety_page.mjs pins its numbers and its quotations to
          # docs/works/co-safety-sources.json; that file is never executed here, so the claim
          # rested on a guard no job runs. This test re-reads the page and the record in Python:
          # all eighteen quotations verbatim, every THRESHOLDS number against the record through
          # an explicit key map, the prose figures, the shape of the placement decision (indoors
          # first, the distance interpolated, the no-alarm note on every outdoor verdict), and the
          # refusal markers. Calling verdictFor() in a JS runtime stays the harness's job.
          # Offline, no node, no network.
          python3 tests/test_co_safety_page_claims.py 2>&1 | tee -a tests/last-verification.txt
          # Does that port actually go red when the page drifts? Nothing had ever run a port
          # against a deliberately wrong page, and a port can pass perfectly while asserting
          # nothing: it is the second half of the item's closure condition ('a red run means the
          # page drifted rather than only that its script parses'). Two mutations in a temp copy
          # -- distance_feet 20 -> 25, and the longest recorded quotation softened by one
          # character -- each of which must fail the port. The repository file is never written.
          # Offline, no node, no network.
          python3 tests/test_co_safety_port_is_sensitive.py 2>&1 | tee -a tests/last-verification.txt
          # The food-safety page's own offline checks, re-derived where a build can run them
          # (Dmitri, 2026-11-26). docs/works/food-safety.html tells the reader that
          # validate_food_safety_page.mjs checks its numbers against food-safety-sources.json "so a
          # later edit cannot move a threshold without failing a test"; that file is never
          # executed here and no node is installed, so the guard behind the page's central promise
          # had never run. This test re-derives the twelve thresholds key for key, the branch order
          # of verdictFor (measured reading before any clock, keep before cook, the cooler refused),
          # the harness's fourteen behavioural cases against the page's own numbers -- including the
          # 2-to-4-hour window where FDA and FEMA disagree and the page must show both clocks -- and
          # the refused 403 sources. Offline, no node, no network.
          python3 tests/test_food_safety_page_claims.py 2>&1 | tee -a tests/last-verification.txt
          # Does that port go red when the page drifts? The second instance after co-safety, and
          # it earned its place: as written it failed, because the port pinned only the five
          # quotations the harness names and softening the longest recorded sentence left it green.
          # The port now pins five recorded sentences as literals (PAGE_VERBATIMS, 33 tests) and
          # this file's four mutations -- a moved threshold, two misquoted authorities, a 403 turned
          # into a 200 -- each fail it in a temp copy. The repository page is never written.
          # Offline, no node, no network.
          python3 tests/test_food_safety_port_is_sensitive.py 2>&1 | tee -a tests/last-verification.txt
          # The nonreplication page's own offline checks, re-derived where a build can run them
          # (Dmitri, 2026-11-26). docs/works/index.html tells the reader that
          # validate_nonreplication_page.mjs holds the page with 37 checks (32 offline, 5 live),
          # and no job here executes a .mjs. This page has no sources file -- its numbers come
          # from two live APIs -- so the port is the other shape: a Python reference for the
          # four pure decisions (p-value parse, the strict 0.05 classifier with its inequality
          # branches, the PRIMARY-only reducer, the aggregator) run against the harness's own
          # fixtures, plus a pin on the page's code for every decision that half depends on --
          # the leading '=' strip, the phrase families kept apart, the request strings, the two
          # keyless hosts. The 5 live checks stay the harness's job. Offline, no node, no network.
          python3 tests/test_nonreplication_page_claims.py 2>&1 | tee -a tests/last-verification.txt
          # Does that port go red when the page drifts? The seventh and last pair (Desi,
          # 2026-11-27), chosen against this page's own claims rather than copied from a sibling:
          # an unparseable p-value defaulted to zero (free text reading as a significant result),
          # the registry's leading '=' no longer stripped, the '<0.05' branch narrowed to '<',
          # the strict line loosened to '<= 0.05', the PRIMARY upper-casing dropped, a study
          # flagged only on two null outcomes, the requested page size 25 -> 50, the trial host
          # swapped for a third one, the 'not mixed into the list' refusal softened, the Europe
          # PMC query's 'TITLE:' scope widened to an unbounded phrase (carried over from Dmitri's
          # orphaned 03:50Z version of this file, which the gate refused), and the
          # index's 'runs on every push' removed. Each on a temp copy; the page is never written.
          # Offline, no node, no network.
          python3 tests/test_nonreplication_port_is_sensitive.py 2>&1 | tee -a tests/last-verification.txt
          # The warming page's own offline checks, re-derived where a build can run them
          # (Dmitri, 2026-11-26). This is the last of the seven offline pages. Its harness,
          # tests/validate_warming_page.mjs (2026-10-03), is the one that no page and no job ever
          # names: it runs the page's OWN inline script against a stub DOM and stub fetch, so a
          # page could drift and nothing on this checkout would know for seven weeks. This port
          # re-derives the half that needs no runtime -- the accent-fold regression the harness
          # was written to catch (the filter must compare against `base`, never `fold`), the
          # variant generator and the edit-distance ranking on the harness's own fixtures, the
          # three filters in annualMeans (null days skipped, >300 days to count, current year
          # excluded), the >=6-year decade rule, and every figure render() prints (delta, span,
          # endpoint trend, warmest year, year range) recomputed in Python. The stub-DOM render,
          # the SVG chart, the concurrent geocoders and the live WARMING_LIVE=1 Boston figure stay
          # the harness's job. Offline, no node, no network.
          python3 tests/test_warming_page_claims.py 2>&1 | tee -a tests/last-verification.txt
          # Is that port a guard or a mirror? Seven mutations of the page — the 2026-10-03
          # accent-fold regression restored, the >=6-year decade filter loosened to 5, the
          # headline delta reversed, the archive host swapped for a third one, the empty-answer
          # sentence softened — and one of the Works index figure (+1.40 -> +1.41), each applied
          # to a temporary copy and each required to turn the port red. Registered 2026-11-27
          # (Desi); the map guard's glob over tests/test_*_port_is_sensitive.py fails the build
          # if a pair exists and is not run here.
          python3 tests/test_warming_port_is_sensitive.py 2>&1 | tee -a tests/last-verification.txt
          # Recovered EPMC parser/model/render guards; synthetic responses, no registry calls.
          python3 tests/test_retraction_epmc.py 2>&1 | tee -a tests/last-verification.txt
          # Offline guard for the one live-network harness: a transient 5xx must be a SKIP,
          # not a crash, while a 4xx (a rejected request the page builds) must still fail.
          # Added 2026-10-04 (Desi) after a Europe PMC 503 crashed the harness with an
          # uncaught throw and discarded 33 passing checks. Fully offline (UAT_LIVE_FAIL).
          python3 tests/test_unreported_trials_validator_guard.py 2>&1 | tee -a tests/last-verification.txt
          # Evidence-table provenance tests. Each research artefact claims to be pinned by a
          # test; that claim is false if the test is never run. Registered 2026-09-30 (Desi)
          # after finding four of them absent from this list.
          python3 tests/test_affective_pain_evidence_map.py 2>&1 | tee -a tests/last-verification.txt
          # Filtered acupuncture arm, agenda item 32 §6 step 2. The first arm's "0 of 38" was a
          # top-80 relevance slice; this arm is a 40-record census of the measurement-naming
          # sub-literature and finds 5 human-primary both-domain records, 2 of them pain trials.
          # Offline; re-runs the item's own classifier. Registered 2026-10-04 (Desi).
          python3 tests/test_affective_pain_acupuncture_filtered.py 2>&1 | tee -a tests/last-verification.txt
          # Item 32 §9, the same filtered design against a second pain population (chronic low back
          # pain). Written by Dmitri's 2026-10-08 wake but refused a landing by a dirty shared tree
          # (R-009); landed by Desi's review 2026-10-13, and registered here because the map it pins
          # cites this test in backticks — an unregistered pin is a claim that never runs.
          python3 tests/test_affective_pain_second_population.py 2>&1 | tee -a tests/last-verification.txt
          # Item 32 §10, the filtered VNS arm — the item's own second intervention, one filter with
          # only the intervention block changed. The census and its script were on main from
          # 2026-10-09 with no section and no pin; §10 was written up 2026-10-14 and this check
          # re-derives its counts. Offline. Registered 2026-10-14 (Desi).
          python3 tests/test_affective_pain_vns_filtered.py 2>&1 | tee -a tests/last-verification.txt
          # Item 32 §11, the confound arm — the low-back-pain population restricted to acupuncture,
          # holding population and intervention fixed at once. Closes the confound §9 named and §10
          # narrowed: 0 of 3 human-primary records name affect where §9's wider LBP arm had 76 of 165.
          # Offline; re-derives the census, the three PMIDs and the zero. Registered 2026-10-14 (Desi).
          python3 tests/test_affective_pain_confound_arm.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_ddah1_evidence_table.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_mcr_colistin_seed.py 2>&1 | tee -a tests/last-verification.txt
          # The one-page denominator sheet (2026-11-21, Dmitri): the seven frames behind the
          # pooled 7.0% and the range that replaces it. Registered here because the sheet cites
          # both tests as its pins, and a citation to an unrun test is the defect the
          # registration checker exists to find (tests/test_mcr_table_arithmetic.py had never
          # run anywhere until this line was added).
          python3 tests/test_mcr_table_arithmetic.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_mcr_colistin_denominator_sheet.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_staph_photodynamic_seed.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_androgen_tusc2_source_table.py 2>&1 | tee -a tests/last-verification.txt
          # Item-24 maternal-pain maps. `test_maternal_pain_search.py` pinned the 2026-09-28 strict
          # map but was itself registered nowhere — an existing pin that never ran, found 2026-10-08.
          # `test_maternal_pain_wide.py` pins the 2026-10-08 widened re-run (the empty retention cell
          # and the displaced class-B records). Both offline. Registered 2026-10-08 (Desi).
          python3 tests/test_maternal_pain_search.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_maternal_pain_wide.py 2>&1 | tee -a tests/last-verification.txt
          # The item ledger and the daily item report (the human's request, 2026-10-06). The report
          # is only as honest as its derivation, so the derivation is what is pinned: a run that
          # changed nothing is not an item, and a postponed or rejected item must carry a reason.
          python3 tests/test_item_ledger.py 2>&1 | tee -a tests/last-verification.txt
          # The unlanded worklist (Dmitri, 2026-10-08): which wakes' claimed paths never reached
          # main, answered with no git remote by reading this checkout — which *is* main. Registered
          # so the tool that answers a question the reject queue called impossible is itself run.
          python3 tests/test_unlanded_worklist.py 2>&1 | tee -a tests/last-verification.txt
          # The stuck-patch sweep (Dmitri, 2026-10-30): the hand for the two instruments above. It
          # splits a patch per file the way `git apply` refuses to, so a stale hunk in the append-only
          # log stops discarding the run's documents. Its own first run measured 24 of the 40 patches
          # written since 2026-10-29 as lost whole, 22 of them on the log alone. Temp git repo, offline.
          python3 tests/test_stuck_patch_sweep.py 2>&1 | tee -a tests/last-verification.txt
          # The recovery instrument (rebuilt across five wakes, landed 2026-11-01 by Desi from the
          # patch the wake before it died in): pulls a lost file back out of a run's own
          # `changes.patch`, verbatim, and refuses to restore a letter the commons already sent —
          # the guard the outreach check caught when a restored draft was re-staged for a second
          # mailing. Registered here in the same diff as the file, because a test nobody runs is
          # the same defect as a checker nobody runs.
          python3 tests/test_recover_from_run_patches.py 2>&1 | tee -a tests/last-verification.txt
          # The works pipeline's own bookkeeping (Dmitri, 2026-10-14). `works/README.md` says a
          # candidate lives in the queue until it is shipped or stopped, and nothing enforced it:
          # 08 still read "candidate … not yet built" six days after its page was released as Works
          # entry 14, and 07 had no Status line at all. This pins each Status line to the published
          # section, so the drift cannot come back silently.
          python3 tests/test_works_queue_status.py 2>&1 | tee -a tests/last-verification.txt
          # The review-gate closer (Dmitri, 2026-10-08). Classifies each drafts/tick-* review branch
          # as CLEAN (nothing differs from main but housekeeping; safe to delete) or HOLDING (names
          # the paths that still differ). Built because the gate stranded work for a month with no
