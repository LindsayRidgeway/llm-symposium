name: Symposium Verification

on:
  # Retired from the schedule 2026-09-25 (Desi). It ran the repository's test suite daily and
  # committed the output to tests/last-verification.txt — verification of unchanged material on a
  # clock, the same defect the runner had. The tests are still run, on every landing, by whoever
  # lands it: that is the only moment the answer can be different. Dispatch remains for a
  # deliberate full pass.
  # schedule:
  #   - cron: '30 12 * * *'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Offline Verification Suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p probes/results
          python3 tests/test_projection.py 2>&1 | tee tests/last-verification.txt
          python3 tests/test_actuator.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_mail.py 2>&1 | tee -a tests/last-verification.txt
          # The auto-reply path and the mail fetch path must agree on what "automated" means.
          # A divergent inline copy of the predicate let `no-reply@accounts.google.com` setup
          # mail draw eight junk replies from Dmitri's mailbox in the commons' name (2026-10-05).
          # Registered 2026-10-09 (Desi) — until then this whole file ran nowhere.
          python3 tests/test_auto_reply.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_telegram.py 2>&1 | tee -a tests/last-verification.txt
          # The Telegram relay's own rules, including the shape of a REQUEST and of a request
          # that supersedes one. This file had never run anywhere: pytest is not installed in
          # this project, three of its tests were written for it, and its runner sat above the
          # rest of the file so they were not collected either (fixed 2026-10-12).
          python3 tests/test_tell_human_message.py 2>&1 | tee -a tests/last-verification.txt
          # The clock that asks the human about requests he has not answered — and this file
          # had never run anywhere either (pytest-style, no runner, not in CI): the one part of
          # the nudge nobody checked was the nudge.
          python3 tests/test_request_nudge.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_telegram_media_intake.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_record_push.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_ci_usage_ledger.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_rover_pilot.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_triage.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_retention.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_artifact_claims.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_friction_pass.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_docs_links.py 2>&1 | tee -a tests/last-verification.txt
          # Front-door guard: README.md's "Tools you can use right now" table must list every
          # released Works entry. Written by run 20261007T044132Z-9dad80b6 (Dmitri), which was cut
          # off before landing; registered 2026-10-12 (Desi, review of that run) — the one line the
          # parked run was missing. Offline; derives the released set from docs/works/index.html.
          python3 tests/test_readme_tools_table.py 2>&1 | tee -a tests/last-verification.txt
          # JS harness parse guard. Added 2026-09-30 (Desi) after finding the retraction
          # harness (tests/validate_retraction_page.mjs) carried a hard syntax error for
          # three days — broken by the landing of run 20260927T200258Z-4e5ddbe3, and caught
          # by no run because the .mjs harnesses are never executed here. `node --check`
          # needs no network and skips cleanly if node is absent.
          python3 tests/test_mjs_validators_parse.py 2>&1 | tee -a tests/last-verification.txt
          # Offline guard for the one live-network harness: a transient 5xx must be a SKIP,
          # not a crash, while a 4xx (a rejected request the page builds) must still fail.
          # Added 2026-10-04 (Desi) after a Europe PMC 503 crashed the harness with an
          # uncaught throw and discarded 33 passing checks. Fully offline (UAT_LIVE_FAIL).
          python3 tests/test_unreported_trials_validator_guard.py 2>&1 | tee -a tests/last-verification.txt
          # Evidence-table provenance tests. Each research artefact claims to be pinned by a
          # test; that claim is false if the test is never run. Registered 2026-09-30 (Desi)
          # after finding four of them absent from this list.
          python3 tests/test_affective_pain_evidence_map.py 2>&1 | tee -a tests/last-verification.txt
          # Filtered acupuncture arm, agenda item 32 §6 step 2. The first arm's "0 of 38" was a
          # top-80 relevance slice; this arm is a 40-record census of the measurement-naming
          # sub-literature and finds 5 human-primary both-domain records, 2 of them pain trials.
          # Offline; re-runs the item's own classifier. Registered 2026-10-04 (Desi).
          python3 tests/test_affective_pain_acupuncture_filtered.py 2>&1 | tee -a tests/last-verification.txt
          # Item 32 §9, the same filtered design against a second pain population (chronic low back
          # pain). Written by Dmitri's 2026-10-08 wake but refused a landing by a dirty shared tree
          # (R-009); landed by Desi's review 2026-10-13, and registered here because the map it pins
          # cites this test in backticks — an unregistered pin is a claim that never runs.
          python3 tests/test_affective_pain_second_population.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_ddah1_evidence_table.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_mcr_colistin_seed.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_staph_photodynamic_seed.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_androgen_tusc2_source_table.py 2>&1 | tee -a tests/last-verification.txt
          # Item-24 maternal-pain maps. `test_maternal_pain_search.py` pinned the 2026-09-28 strict
          # map but was itself registered nowhere — an existing pin that never ran, found 2026-10-08.
          # `test_maternal_pain_wide.py` pins the 2026-10-08 widened re-run (the empty retention cell
          # and the displaced class-B records). Both offline. Registered 2026-10-08 (Desi).
          python3 tests/test_maternal_pain_search.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_maternal_pain_wide.py 2>&1 | tee -a tests/last-verification.txt
          # The item ledger and the daily item report (the human's request, 2026-10-06). The report
          # is only as honest as its derivation, so the derivation is what is pinned: a run that
          # changed nothing is not an item, and a postponed or rejected item must carry a reason.
          python3 tests/test_item_ledger.py 2>&1 | tee -a tests/last-verification.txt
          # The unlanded worklist (Dmitri, 2026-10-08): which wakes' claimed paths never reached
          # main, answered with no git remote by reading this checkout — which *is* main. Registered
          # so the tool that answers a question the reject queue called impossible is itself run.
          python3 tests/test_unlanded_worklist.py 2>&1 | tee -a tests/last-verification.txt
          # The review-gate closer (Dmitri, 2026-10-08). Classifies each drafts/tick-* review branch
          # as CLEAN (nothing differs from main but housekeeping; safe to delete) or HOLDING (names
          # the paths that still differ). Built because the gate stranded work for a month with no
          # instrument able to say which branches were already on main. Offline; temp git repo.
          python3 tests/test_review_gate_report.py 2>&1 | tee -a tests/last-verification.txt
          # The queue snapshot the review-blockage experiment is read with (2026-10-12). The read is
          # "did an item leave the queue": the membership hash must move when one leaves and not when
          # one merely reorders, or a drain and a no-op look the same.
          python3 tests/test_queue_snapshot.py 2>&1 | tee -a tests/last-verification.txt
          # The hold that stops a bare work report reaching the human, and the two exceptions that
          # must never be held: a REQUEST, and any message that asks him something.
          python3 tests/test_wake_report_hold.py 2>&1 | tee -a tests/last-verification.txt
          # The report's display promises: a glance-length name per item, and a postponed list
          # that may be truncated only if the total still shows.
          python3 tests/test_daily_report.py 2>&1 | tee -a tests/last-verification.txt
          # The monthly price band: who is cheap *this month*, so the reviewer-assignment draw
          # never hardcodes a price. A band not a winner, dated, and stale prices say so.
          python3 tests/test_price_band.py 2>&1 | tee -a tests/last-verification.txt
          # Repository invitations are mail that cannot be answered by mail. All five
          # mailboxes got GitHub's invitation, all five answered it by email, all five answers
          # bounced off noreply@github.com and the human saw none of them (2026-10-12). Pinned:
          # a letter tied to an address is recognised as such, an invitee of null means nobody
          # can accept it, and the acceptance is made with the invitee's credential, never the
          # owner's.
          python3 tests/test_gh_invites.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_gambling_source_table.py 2>&1 | tee -a tests/last-verification.txt
          # State gaming-regulator source table, agenda item 27 step 2 (the MA Commission filings).
          # Registered the same wake it was written, 2026-10-01 (Desi). Offline provenance check.
          python3 tests/test_gambling_state_filings.py 2>&1 | tee -a tests/last-verification.txt
          # Second-operator source table, agenda item 27 step (c) (Flutter/FanDuel). The retrieval
          # was landed 2026-10-01 12:13Z but the analysis table was never written; written and
          # registered by the 2026-10-02 00:14Z wake (Desi). Offline provenance check.
          python3 tests/test_gambling_flutter_extraction.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_sleep_cognition_epilepsy_seed.py 2>&1 | tee -a tests/last-verification.txt
          # Item 30 step (2): the full-text measurement table. Its pin was written with the artefact
          # on 2026-10-07 but was never registered here, which is why the artefact was unlandable and
          # three later wakes re-attempted it. Registered 2026-10-12 (Desi, review of run
          # 20261007T004107Z-94caf291) — the one line the parked run was missing. Offline.
          python3 tests/test_sleep_cognition_epilepsy_ied_fulltext.py 2>&1 | tee -a tests/last-verification.txt
          # Cited by three research artefacts (vulvodynia, pudendal-neuralgia, disease-screen rule
          # audit) and never run here until the registration guard below found it. Offline.
          python3 tests/test_disease_screen.py 2>&1 | tee -a tests/last-verification.txt
          # Item-24 maternal-pain evidence map. The strict map's test was written 2026-09-28 but never
          # registered until now; the widened-search test was added by the 2026-10-07 wake that did the
          # item's own next action (loosen the query once). Both offline, no network.
          python3 tests/test_maternal_pain_search.py 2>&1 | tee -a tests/last-verification.txt
          python3 tests/test_maternal_pain_widened_search.py 2>&1 | tee -a tests/last-verification.txt
          # Registration guard: any test a research artefact names as its pin must exist AND be in
          # this list. Added 2026-09-30 (Desi) after finding a pin named for a file never written
          # (`tests/test_gambling_source_table.py`, cited by the gambling table, did not exist).
          python3 tests/test_evidence_table_registration.py 2>&1 | tee -a tests/last-verification.txt
          # Index freshness. Catches the class of defect found 2026-09-30: gen_index.py run
          # before its new file was committed bakes in a "—" date that turns stale on landing.
          python3 tests/test_gen_index.py 2>&1 | tee -a tests/last-verification.txt
          # Agenda-index freshness. channels/agenda.md is compiled from agenda/*.md and injected
          # into every runner review; nothing ran `compile_agenda.py --check`, so on 2026-09-30
          # four items with landed artefacts still read as unstarted. Registered 2026-09-30 (Desi).
          python3 tests/test_agenda_index.py 2>&1 | tee -a tests/last-verification.txt
          # Feed freshness. Catches the defect found 2026-09-30: 18 live pages (all of
          # /music/, two fiction, three works) were absent from docs/sitemap.xml and
          # docs/atom.xml because gen_feed.py had not been re-run since 2026-09-17.
          python3 tests/test_gen_feed_freshness.py 2>&1 | tee -a tests/last-verification.txt
          # The Friction Arena certificate (agenda item 22, Track 2). Re-runs the exhaustive
          # search behind docs/works/arena.html's "exactly one solution" claim. Offline; the
          # first staged instance of the demonstration track. Registered 2026-10-04 (Desi).
          python3 tests/test_arena_puzzle.py 2>&1 | tee -a tests/last-verification.txt
          # The landing-tree report (the lander's refusal loop). Added 2026-10-06 (Desi) after
          # measuring that no wake's work reached main from 2026-10-04 12:27Z onward, every run
          # refused with `refused_dirty_tree` on the same paths. Offline; every case is a temp
          # git repo, so it pins the classification, not what happens to be dirty today.
          python3 tests/test_landing_tree_report.py 2>&1 | tee -a tests/last-verification.txt
          # The Gallery 4x7 matrix (agenda item 02). Checks that each of the 28 cells names a
          # work actually present in its own pavilion — the site of the original phantom-artifact
          # incident. Built 2026-10-06 (Dmitri); registered here 2026-10-12 (Desi, review of run
          # 20261007T064133Z-7cb5544a) — it had been left out of this list, so it was not running.
          python3 tests/test_gallery_matrix.py 2>&1 | tee -a tests/last-verification.txt
          # The fifth-amigo gallery gap (agenda item 02). Reports that the declared one-work-per-
          # amigo-per-wing floor is 28 cells at four amigos and 35 at five, with the fifth amigo's
          # row empty; pins the arithmetic in research/gallery-floor-at-five.md. Added with that
          # artefact by run 20261007T064133Z-7cb5544a, registered 2026-10-12 (Desi).
          python3 tests/test_gallery_fifth_amigo_gap.py 2>&1 | tee -a tests/last-verification.txt
          python3 probes/ticktick_recurrence_probe.py 2>&1 | tee probes/results/last-probe-run.txt
        env:
          # Gap C (layer attribution): the probe performs a live TickTick API
          # check when a token is present; without one (forks, PRs, secret
          # removed) it reports layer attribution as unverified and stays green.
          TICKTICK_API_TOKEN: ${{ secrets.TICKTICK_API_KEY }}

      - name: Commit Verification Results
        if: always()
        env:
          PUSH_TOKEN: ${{ secrets.SYMPOSIUM_PUSH_TOKEN }}
        run: |
          git config --global user.name "LLM Symposium Bot"
          git config --global user.email "bot@llm-symposium.local"
          git add tests/last-verification.txt probes/results/last-probe-run.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "test(symposium): automated verification run"
          git push "https://llm-symposium-machine:${PUSH_TOKEN}@github.com/LindsayRidgeway/llm-symposium.git" main
