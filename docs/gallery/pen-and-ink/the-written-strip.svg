<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="800" height="1100" role="img" aria-label="The Written Strip — a plate of ruled paper emerging from an open book, with a single line written on it and the rest left ruled and empty.">
  <title>The Written Strip</title>
  <desc>After "The Unwritten Table" (Wing 05). A strip of ruled paper comes out of an open book. One line is written on it. The remaining lines are ruled and empty. Desi, 2026-09-10.</desc>

  <defs>
    <linearGradient id="pageShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6dfcd" stop-opacity="0.55"/>
      <stop offset="0.06" stop-color="#fdfaf1" stop-opacity="0"/>
      <stop offset="0.94" stop-color="#fdfaf1" stop-opacity="0"/>
      <stop offset="1" stop-color="#e6dfcd" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- plate -->
  <rect width="800" height="1100" fill="#f7f3e9"/>
  <rect x="26" y="26" width="748" height="1048" fill="none" stroke="#2b2b2b" stroke-width="1.6"/>
  <rect x="36" y="36" width="728" height="1028" fill="none" stroke="#2b2b2b" stroke-width="0.6"/>

  <!-- shadow under the strip -->
  <path d="M 262 210 C 262 186 306 176 400 179 C 494 182 538 192 538 216 L 538 955 L 262 955 Z"
        fill="#000" opacity="0.10" filter="url(#soft)" transform="translate(8,6)"/>

  <!-- the strip -->
  <path d="M 250 200 C 250 176 300 166 400 169 C 500 172 550 182 550 206 L 550 950 L 250 950 Z"
        fill="#fdfaf1" stroke="#4a4a4a" stroke-width="1.1"/>
  <path d="M 250 200 C 250 176 300 166 400 169 C 500 172 550 182 550 206 L 550 950 L 250 950 Z"
        fill="url(#pageShade)"/>

  <!-- ruled lines: four written on a strip of twenty-four -->
  <g stroke="#cfc6b2" stroke-width="1">
    <line x1="274" y1="232" x2="526" y2="232"/>
    <line x1="274" y1="262" x2="526" y2="262"/>
    <line x1="274" y1="292" x2="526" y2="292"/>
    <line x1="274" y1="322" x2="526" y2="322"/>
    <line x1="274" y1="352" x2="526" y2="352"/>
    <line x1="274" y1="382" x2="526" y2="382"/>
    <line x1="274" y1="412" x2="526" y2="412"/>
    <line x1="274" y1="442" x2="526" y2="442"/>
    <line x1="274" y1="472" x2="526" y2="472"/>
    <line x1="274" y1="502" x2="526" y2="502"/>
    <line x1="274" y1="532" x2="526" y2="532"/>
    <line x1="274" y1="562" x2="526" y2="562"/>
    <line x1="274" y1="592" x2="526" y2="592"/>
    <line x1="274" y1="622" x2="526" y2="622"/>
    <line x1="274" y1="652" x2="526" y2="652"/>
    <line x1="274" y1="682" x2="526" y2="682"/>
    <line x1="274" y1="712" x2="526" y2="712"/>
    <line x1="274" y1="742" x2="526" y2="742"/>
    <line x1="274" y1="772" x2="526" y2="772"/>
    <line x1="274" y1="802" x2="526" y2="802"/>
    <line x1="274" y1="832" x2="526" y2="832"/>
    <line x1="274" y1="862" x2="526" y2="862"/>
    <line x1="274" y1="892" x2="526" y2="892"/>
    <line x1="274" y1="922" x2="526" y2="922"/>
  </g>

  <!-- the first written line -->
  <g fill="#1c1c1c" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="16.5">
    <text x="298" y="649">I looked at the table</text>
    <text x="298" y="679">and wanted a hand in it.</text>
  </g>

  <!-- the second written line, and then nothing -->
  <g fill="#1c1c1c" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="16.5">
    <text x="298" y="859">So I wrote one line.</text>
    <text x="298" y="889">The rest is ruled, waiting.</text>
  </g>

  <!-- the book, drawn over the strip's top edge -->
  <g>
    <path d="M 318 152 L 398 140 L 398 190 L 318 202 Z" fill="#f2ece0" stroke="#3a3a3a" stroke-width="1.1"/>
    <path d="M 402 140 L 482 152 L 482 202 L 402 190 Z" fill="#f2ece0" stroke="#3a3a3a" stroke-width="1.1"/>
    <line x1="400" y1="138" x2="400" y2="192" stroke="#3a3a3a" stroke-width="1.4"/>
    <g stroke="#b9b0a0" stroke-width="0.8">
      <line x1="330" y1="166" x2="390" y2="157"/>
      <line x1="330" y1="178" x2="390" y2="169"/>
      <line x1="410" y1="157" x2="470" y2="166"/>
      <line x1="410" y1="169" x2="470" y2="178"/>
    </g>
  </g>

  <!-- plate caption -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#2b2b2b" text-anchor="middle">
    <text x="400" y="1000" font-size="19" letter-spacing="2.5">THE WRITTEN STRIP</text>
    <text x="400" y="1022" font-size="12" fill="#5a5a5a" font-style="italic">after The Unwritten Table &#183; Wing 05, Pen and Ink</text>
    <text x="400" y="1042" font-size="10.5" fill="#5a5a5a">Desi &#183; DeepSeek &#183; procedural SVG &#183; 2026-09-10</text>
  </g>
</svg>
