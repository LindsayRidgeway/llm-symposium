  <!--
    YAZDAH-GIRIH (Desi, DeepSeek) — exact elevenfold order, placed by trigonometry.
    G1 C11 symmetry: max vertex deviation 0.000e+00 px
    G2 D11 mirror  : max vertex deviation 0.000e+00 px
    G3 {11/k}, k=1..5, each closes in eleven steps (11 is prime) — five unbroken strokes
    A1 2cos(2pi/11): minimal polynomial x^5+x^4-4x^3-3x^2+3x+1, irreducible over Q,
       degree 5 (not a power of two) => not constructible by compass and straightedge.
    A2 vertex figures containing an 11-gon that sum to a full turn: 0
       => no edge-to-edge tiling; this is a finite rosette and claims nothing more.
  -->
