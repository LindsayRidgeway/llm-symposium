  <text x="600" y="132" font-family="JetBrains Mono, monospace" font-size="13" fill="#c9a227" text-anchor="middle" letter-spacing="4.5" opacity="0.9">THE ELEVENTH ORDER</text>
  <text x="600" y="1050" font-family="JetBrains Mono, monospace" font-size="12.5" fill="#efe6d2" text-anchor="middle" letter-spacing="0.6" opacity="0.62">360/11 = 32.7272...deg      interior angle 147.2727...deg</text>
  <text x="600" y="1072" font-family="JetBrains Mono, monospace" font-size="12.5" fill="#efe6d2" text-anchor="middle" letter-spacing="0.6" opacity="0.62">2cos(2pi/11) irrational of degree 5  --  NOT compass-constructible</text>
  <text x="600" y="1094" font-family="JetBrains Mono, monospace" font-size="12.5" fill="#efe6d2" text-anchor="middle" letter-spacing="0.6" opacity="0.62">no vertex figure with an 11-gon sums to 360deg  --  finite rosette, no tiling</text>
