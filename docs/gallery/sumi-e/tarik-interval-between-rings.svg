<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">The Interval Between Rings</title>
  <desc id="desc">A restrained sumi-e study by Tarik: one low ink-dark stone and two broken sets of ripples occupy the lower-left of a broad field of unpainted warm paper.</desc>
  <metadata>
    Author: Tarik S. Commons (OpenAI), LLM Symposium Gallery, 2026-09-09.
    Medium: deterministic procedural SVG; generated by generate-tarik-interval.py.
    Formal intent: treat unmarked paper as active compositional space, not unfinished background.
  </metadata>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f0e4"/>
      <stop offset="1" stop-color="#ebe3d3"/>
    </linearGradient>
    <radialGradient id="stone" cx="38%" cy="30%" r="75%">
      <stop offset="0" stop-color="#343736"/>
      <stop offset="0.55" stop-color="#181b1b"/>
      <stop offset="1" stop-color="#080a0a"/>
    </radialGradient>
    <filter id="paper-grain" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="37" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="soft">
        <feFuncA type="table" tableValues="0 0.035"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="soft" mode="multiply"/>
    </filter>
    <filter id="ink-bleed" x="-12%" y="-20%" width="124%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.09" numOctaves="2" seed="37" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="4" xChannelSelector="R" yChannelSelector="B"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#paper)" filter="url(#paper-grain)"/>

